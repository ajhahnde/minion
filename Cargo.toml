[package]
name = "minion"
version = "0.1.0"
edition = "2024"
description = "Small AI-powered command line helpers."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
